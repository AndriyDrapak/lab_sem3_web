<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stadiums</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>
<header>
  <nav class="header__menu">
    <ul>
      <li><input type="text" id="searchInput" placeholder="Пошук за назвою" oninput="searchStadiumByName()"></li>
      <li><h1>Опції сортування:</h1></li>
      <li><button onclick="sortByAlphabet()">Сортувати за алфавітом</button></li>
      <li><button onclick="sortByViewers()">Сортувати за к-стю глядачів</button></li>
      <li><button onclick="sortByLux()">Сортувати за люксами</button></li>
    </ul>
  </nav>
</header>
<div id="stadiums__content">
</div>
<p id="total-lux">Загальна потужність освітлення: <span id="totallux"></span> люксів</p>
<script src="js/main.js"></script>
</body>
</html>
